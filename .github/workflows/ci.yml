name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version's result, not just the first failure.
      fail-fast: false
      matrix:
        # The dev toolchain sets the floor, not the packages' `engines` field:
        # eslint 10 requires ^20.19 || ^22.13 || >=24, jsdom requires ^20.19 ||
        # ^22.12 || >=24, and vite 7 requires ^20.19 || >=22.12. Node 18 cannot
        # run lint or test at all. See the follow-up note about `engines`.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose: action-setup reads `packageManager`
      # from the root package.json, so the lockfile and CI cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  bundles:
    name: bundle externals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # @bladets/tempo shipped an inlined copy of the @bladets/template engine
      # in both 0.4.0 and 0.5.0. This is the mechanical gate that stops a third.
      # The same script also asserts that @bladets/template's default and
      # browser entries reach no Node built-in, which is what keeps
      # `import { compile } from '@bladets/template'` loadable on Cloudflare
      # Workers, Vercel Edge and Deno Deploy.
      - name: Assert peer dependencies stay external and entries stay neutral
        run: pnpm check:bundles

      # Both entry points were `export *` barrels publishing 302 declarations,
      # so any internal rename was a breaking change nobody could see. The
      # checked-in api/*.api.md reports turn an addition or a removal into a
      # diff a reviewer has to approve.
      - name: Assert the public API surface matches its record
        run: pnpm check:api

  typecheck-tests:
    name: typecheck test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The test suites were excluded from typechecking indefinitely and had
      # accumulated type errors against the APIs they exercise. That debt is
      # paid off, so this job is blocking - it is what keeps the suites from
      # drifting away from the source types again.
      - run: pnpm typecheck:tests
