name: Release

# Changesets is the single release mechanism for @bladets/template,
# @bladets/lsp-server and @bladets/tempo. On every push to main this either
# opens or updates a "release: version packages" PR. It NEVER publishes:
# publishing is a deliberate local act via ./scripts/publish.sh, because an npm
# version number can never be reused and a push to main must not be able to
# spend one.
#
# blade-templates (the VS Code extension) is listed in `.changeset/config.json`
# under `ignore` - it ships to the Marketplace, not to npm.
#
# No NPM_TOKEN is needed or used here - this workflow only writes a branch and
# opens a PR. Run `pnpm release` locally to publish once that PR is merged.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs full history to work out what changed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same gate as CI, re-run here so a publish can never outrun a red build.
      - run: pnpm check
      - run: pnpm check:bundles
      - run: pnpm check:api

      - uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: 'release: version packages'
          title: 'release: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
